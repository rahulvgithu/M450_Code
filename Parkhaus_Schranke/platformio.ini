; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html
;
; Firmware auf den Pico laden:   pio run -e pico -t upload
; Automatisierte Tests (PC):     pio test -e native

[platformio]
default_envs = pico

[env]
; Gemeinsame, hardwareunabhaengige Logik in ../lib/Parksystem
lib_extra_dirs = ../lib

[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipicow
framework = arduino
board_build.core = earlephilhower

[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17
